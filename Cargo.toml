[package]
name = "texcompiler"
version = "2.0.0-dev.2"
edition = "2024"
rust-version = "1.100"
publish = false
default-run = "texcompiler"

[dependencies]
axum = "0.8.9"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "signal", "process", "time", "sync", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

serde_json = "1.0"
tempfile = "3.27"
thiserror = "2.0"
base64 = "0.22"
lopdf = { version = "0.47", default-features = false }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
