[package]
name = "texcompiler"
version = "2.0.0-dev.1"
edition = "2024"
rust-version = "1.100"
publish = false

[dependencies]
axum = "0.8.9"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
serde_json = "1.0"
tower = { version = "0.5.3", features = ["util"] }
