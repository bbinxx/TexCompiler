name: Native worker integration
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install native toolchain and compatibility tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap util-linux texlive-latex-extra texlive-xetex texlive-luatex latexmk biber poppler-utils
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Run explicit native and isolation gates (no skips)
        run: cargo test --locked --all-features -- --include-ignored
