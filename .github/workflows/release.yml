name: Release
on:
  push:
    tags: ['v2.*.*']
permissions:
  contents: read
jobs:
  rust:
    uses: ./.github/workflows/rust.yml
  native:
    uses: ./.github/workflows/native-worker.yml
  container:
    uses: ./.github/workflows/container.yml
  dependencies:
    uses: ./.github/workflows/dependencies.yml
  publish:
    needs: [rust, native, container, dependencies]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require the tag to match the source version
        run: |
          node -e 'const fs=require("node:fs"); const version=fs.readFileSync("Cargo.toml","utf8").match(/^version = "([^"]+)"/m)[1]; if(process.env.GITHUB_REF_NAME!==`v${version}`)process.exit(1)'
      - run: rustup toolchain install 1.100.0 --profile minimal
      - run: cargo build --locked --release --bins
      - name: Package both native binaries and operational guides
        run: |
          mkdir -p dist/package/docs
          cp target/release/texcompiler target/release/texcompiler-worker README.md dist/package/
          cp docs/INSTALLATION.md docs/DEPLOYMENT.md docs/API.md docs/SECURITY.md dist/package/docs/
          bash scripts/dev/collect-rust-licenses.sh dist/package/licenses
          tar -C dist/package -czf "dist/texcompiler-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" .
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: dist/*.tar.gz
          body: |
            Native Rust service and worker for Linux x86_64.
            Install the documented TeX Live/Bubblewrap dependencies, keep both binaries together,
            then run ./texcompiler. See the included installation/deployment guides.
            No Python runtime is required. Release publication is gated by Rust, native,
            restricted-container/browser and dependency checks.
