name: Native worker integration
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install native toolchain and compatibility tools
        timeout-minutes: 10
        run: |
          # Avoid the slow regional HTTP mirror seen in the initial CI run.
          sudo sed -i -E 's@http://[a-z0-9.-]*ec2.archive.ubuntu.com/ubuntu/?@https://archive.ubuntu.com/ubuntu/@g; s@http://security.ubuntu.com/ubuntu/?@https://security.ubuntu.com/ubuntu/@g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Acquire::Retries=3 -o Acquire::https::Timeout=30 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::https::Timeout=30 install -y --no-install-recommends bubblewrap util-linux texlive-latex-extra texlive-xetex texlive-luatex texlive-fonts-recommended latexmk poppler-utils
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Run explicit native and isolation gates (no skips)
        run: cargo test --locked --all-features -- --include-ignored
